# Preview: despliega preview de cada PR (opcional)
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Solo si existen los secrets (evita fallar en forks sin secrets)
    if: ${{ vars.ENABLE_PR_PREVIEW == 'true' }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm install
      - run: npm run build
        env:
          WEBPAY_ENV: integration

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kadmiel-cl --branch=pr-${{ github.event.pull_request.number }}

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}' || 'ver Cloudflare Pages';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 **Preview desplegado**\n\n${url}\n\n_Commit: \`${{ github.sha }}\`_`
            });
